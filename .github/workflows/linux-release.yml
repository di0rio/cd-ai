name: Linux release

on:
  pull_request:
  workflow_dispatch:
  push:
    # `main` too: without it nothing guards the branch between releases, since a merge
    # commit is never itself checked by the pull_request run.
    branches: [main]
    tags: ["v*"]

# Read-only by default: a step that runs the repository's own code (`bun run verify`, cargo build
# scripts) must not hold a token that can write to it. Only the `release` job gets `contents: write`.
permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      # Third-party actions are pinned by commit, not by a tag that can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Hosted runners have ~7 GiB. Debug clippy/test and the Tauri/WebKit link
      # otherwise OOM the agent ("hosted runner lost communication").
      - name: Enable swap
        run: |
          free -h
          swapon --show || true
          if swapon --show | grep -q .; then
            echo "swap already enabled"
            exit 0
          fi
          SWAPFILE=/mnt/swapfile
          sudo rm -f "$SWAPFILE"
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          swapon --show
          free -h

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Same Bun that wrote bun.lock; bump together with the lockfile.
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: linux-release-v2

      - run: bun install --frozen-lockfile

      # Local gate remains `bun run verify` (includes desktop + cargo test).
      # CI does not run `cargo test`: compiling the agent-core test harness
      # (or the sandbox/netns tests) killed the hosted agent after ~46 min.
      - name: Verify frontend and release metadata
        run: |
          bun run check
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/desktop test
          bun scripts/check-release-metadata.ts
          cargo fmt --all --check

      - name: Clippy agent-core + CLI
        timeout-minutes: 20
        run: cargo clippy -p agent-core -p cd-ai-cli -- -D warnings

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file \
            build-essential

      - name: Build .deb and AppImage
        timeout-minutes: 40
        run: bun scripts/build-linux-release.ts

      - name: Eval scripted with packaged CLI
        timeout-minutes: 10
        run: |
          chmod +x dist/linux/cd-ai
          dist/linux/cd-ai eval --scripted --suite evals --out evals/results/scripted-ci.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cd-ai-linux-x86_64
          path: dist/linux/*
          if-no-files-found: error

      - name: Inspect .deb
        run: |
          deb=$(ls dist/linux/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'cd-ai|evals' | head -40

  # Only on a tag, and the only job that can write to the repository. It does not check out or run
  # any repository code: it publishes what the build job produced.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux-x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cd-ai-linux-x86_64
          path: dist/linux

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/linux/*
          generate_release_notes: true
          draft: true
