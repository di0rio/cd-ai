name: Linux release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file \
            build-essential

      - run: bun install --frozen-lockfile

      - run: bun run verify

      - name: Eval scripted
        run: cargo run -q -p cd-ai-cli -- eval --scripted --out evals/results/scripted-ci.json

      - name: Build .deb and AppImage
        run: bun scripts/build-linux-release.ts

      - uses: actions/upload-artifact@v4
        with:
          name: cd-ai-linux-x86_64
          path: dist/linux/*
          if-no-files-found: error

      - name: Inspect .deb
        run: |
          deb=$(ls dist/linux/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'cd-ai|evals' | head -40

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/linux/*
          generate_release_notes: true
          draft: true
