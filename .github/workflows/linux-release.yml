name: Linux release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Hosted runners have ~7 GiB. Debug clippy/test and the Tauri/WebKit link
      # otherwise OOM the agent ("hosted runner lost communication").
      - name: Enable swap
        run: |
          free -h
          swapon --show || true
          if swapon --show | grep -q .; then
            echo "swap already enabled"
            exit 0
          fi
          SWAPFILE=/mnt/swapfile
          sudo rm -f "$SWAPFILE"
          sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          swapon --show
          free -h

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: linux-release-v2

      - run: bun install --frozen-lockfile

      # Local gate remains `bun run verify` (includes desktop). CI skips debug
      # WebKit and clippy --all-targets: both exhausted the previous runners.
      - name: Verify frontend and release metadata
        run: |
          bun run check
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/desktop test
          bun scripts/check-release-metadata.ts
          cargo fmt --all --check

      - name: Clippy agent-core + CLI
        timeout-minutes: 20
        run: cargo clippy -p agent-core -p cd-ai-cli -- -D warnings

      - name: Test agent-core + CLI
        timeout-minutes: 20
        env:
          RUST_TEST_THREADS: "2"
        run: cargo test -p agent-core -p cd-ai-cli

      - name: Eval scripted
        timeout-minutes: 10
        run: cargo run -q -p cd-ai-cli -- eval --scripted --out evals/results/scripted-ci.json

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file \
            build-essential

      - name: Build .deb and AppImage
        timeout-minutes: 40
        run: bun scripts/build-linux-release.ts

      - uses: actions/upload-artifact@v4
        with:
          name: cd-ai-linux-x86_64
          path: dist/linux/*
          if-no-files-found: error

      - name: Inspect .deb
        run: |
          deb=$(ls dist/linux/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'cd-ai|evals' | head -40

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/linux/*
          generate_release_notes: true
          draft: true
