[package]
name = "agent-core"
version.workspace = true
edition.workspace = true

[dependencies]
libc = "0.2"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde.workspace = true
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ts-rs = "12.0.1"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Runs as its own `main` so the test binary can act as the sandbox launcher (`sandbox::init`).
[[test]]
name = "windows_sandbox"
harness = false
